# Optional monitoring stack (not started by default production compose).
# Usage (on a monitoring host or alongside staging):
#   docker compose -f deploy/monitoring/docker-compose.monitoring.yml up -d
#
# Point Uptime Kuma / Prometheus at:
#   http://<app-host>/health   → expect {"status":"ok","database":"ok",...}

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: zedral-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: zedral-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  loki:
    image: grafana/loki:3.1.1
    container_name: zedral-loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    restart: unless-stopped

  uptime-kuma:
    image: louislam/uptime-kuma:1.23.15
    container_name: zedral-uptime-kuma
    volumes:
      - uptime_data:/app/data
    ports:
      - "3002:3001"
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  uptime_data:
