# Production / QA stack — pull-only. Never build on the host.
# Images are set by CI/CD via BACKEND_IMAGE / NGINX_IMAGE in deploy/.env.
#
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env pull
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --no-build
#
# Postgres pgaudit image: build from deploy/postgres/ and set POSTGRES_IMAGE=
# (default stays postgres:15-alpine until QA soak). Runtime secrets stay in deploy/.env.

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:15-alpine}
    container_name: zedral-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Optional SSL certs (SAFE_CHANGE #15) — uncomment when ready:
      # - ./postgres/ssl:/var/lib/postgresql/ssl:ro
    # When using POSTGRES_IMAGE with pgaudit, the image CMD already sets shared_preload_libraries.
    # Optional SSL command (server certs first, then DATABASE_SSL=true on backend):
    # command: ["postgres","-c","ssl=on","-c","ssl_cert_file=/var/lib/postgresql/ssl/server.crt","-c","ssl_key_file=/var/lib/postgresql/ssl/server.key"]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - zedral

  # ponytail: ST core required for staff EmailPassword + badge sessions; pin major for compose stability
  # No host port — keep SuperTokens on the internal compose network only.
  supertokens:
    image: registry.supertokens.io/supertokens/supertokens-postgresql:11.4.5
    container_name: zedral-supertokens
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRESQL_CONNECTION_URI: "postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}"
      API_KEYS: ${SUPERTOKENS_API_KEY}
      ACCESS_TOKEN_VALIDITY: 900
      REFRESH_TOKEN_VALIDITY: 10080
    restart: unless-stopped
    networks:
      - zedral

  redis:
    image: redis:7-alpine
    container_name: zedral-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - zedral

  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to a GHCR tag (sha or vX.Y.Z)}
    container_name: zedral-backend
    environment:
      NODE_ENV: production
      PORT: 3005
      DB_HOST: db
      DB_PORT: 5432
      # Runtime app role — subject to RLS. Secrets stay in deploy/.env (QA has no Docker secret files).
      # ponytail: *_FILE injection stays in docker-entrypoint.sh for later; do not require compose secrets.
      DB_USER: ${DB_APP_USER:-m1_app}
      DB_PASSWORD: ${DB_APP_PASSWORD:-m1_app_password}
      DB_APP_USER: ${DB_APP_USER:-m1_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-m1_app_password}
      DB_NAME: ${DB_NAME}
      DATABASE_URL: postgres://${DB_APP_USER:-m1_app}:${DB_APP_PASSWORD:-m1_app_password}@db:5432/${DB_NAME}
      DB_MIGRATE_USER: ${DB_USER}
      DB_MIGRATE_PASSWORD: ${DB_PASSWORD}
      MIGRATE_DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_STRICT: ${AUTH_STRICT:-true}
      VALIDATION_STRICT: ${VALIDATION_STRICT:-true}
      TENANT_ID: ${TENANT_ID}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
      EXPORT_WORKER_ENABLED: ${EXPORT_WORKER_ENABLED:-true}
      EXPORT_WORKER_POLL_MS: ${EXPORT_WORKER_POLL_MS:-15000}
      DPR_SCHEDULER_ENABLED: ${DPR_SCHEDULER_ENABLED:-true}
      SHIFT_BOUNDARY_SCHEDULER_ENABLED: ${SHIFT_BOUNDARY_SCHEDULER_ENABLED:-false}
      CACHE_DRIVER: ${CACHE_DRIVER:-memory}
      REDIS_URL: ${REDIS_URL:-}
      SUPERTOKENS_CORE_URI: http://supertokens:3567
      SUPERTOKENS_API_KEY: ${SUPERTOKENS_API_KEY}
      API_DOMAIN: ${API_DOMAIN}
      WEBSITE_DOMAIN: ${WEBSITE_DOMAIN}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      DATABASE_SSL_REJECT_UNAUTHORIZED: ${DATABASE_SSL_REJECT_UNAUTHORIZED:-true}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-}
    depends_on:
      db:
        condition: service_healthy
      supertokens:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:3005/health" ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 120s
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - zedral

  nginx:
    image: ${NGINX_IMAGE:?Set NGINX_IMAGE to a GHCR tag (sha or vX.Y.Z)}
    container_name: zedral-nginx
    ports:
      - "${DOCKER_HTTP_BIND:-0.0.0.0:80}:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - zedral

networks:
  zedral:
    driver: bridge

volumes:
  pg_data:
  redis_data:
