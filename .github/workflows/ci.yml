name: CI

# Build once (quality + GHCR images). Deploy many: deploy-aws.yml / deploy-production.yml.

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'doc/**'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'doc/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  lockfile:
    name: Lockfile sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-npm
      - run: npm ci
      - run: node scripts/ensure-native-bindings.mjs
      - name: Fail if package-lock.json drifts from package.json
        run: |
          npm install --package-lock-only --ignore-scripts
          git diff --exit-code -- package-lock.json \
            || { echo "::error::package-lock.json out of sync with package.json — run npm install on Linux (npm@11.4.2) and commit the lock"; exit 1; }

  lint:
    name: Lint
    needs: [lockfile]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-npm
      - run: npm ci
      - run: node scripts/ensure-native-bindings.mjs
      - run: npm run lint
      - name: Safe-change guard rails (sourcemap / ES)
        run: bash deploy/scripts/check-safe-change-guards.sh
      - name: Validate nginx /auth proxy (source)
        run: bash deploy/scripts/validate-nginx-auth-proxy.sh

  build:
    name: Build · typecheck · client
    needs: [lockfile]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-npm
      - run: npm ci
      - run: node scripts/ensure-native-bindings.mjs
      - run: npm run build
      - run: npm run test -w @m1/client
      - run: npm run check:operator-bundle -w @m1/client

  unit:
    name: Server unit
    needs: [lockfile]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-npm
      - run: npm ci
      - run: node scripts/ensure-native-bindings.mjs
      - run: npm run build -w @m1/shared-validation
      - run: npm run build -w @zedral/platform
      - run: npm run build -w @zedral/connectors
      - run: npm run build -w @zedral/m1-collection
      - run: npm run build -w @m1/server
      - run: npm run test:unit -w @m1/server

  integration:
    name: Migrate · integration
    needs: [lockfile]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: m1_user
          POSTGRES_PASSWORD: m1_password
          POSTGRES_DB: m1_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U m1_user -d m1_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: m1_user
      DB_PASSWORD: m1_password
      DB_NAME: m1_db
      DB_APP_USER: m1_app
      DB_APP_PASSWORD: m1_app_password
      DATABASE_URL: postgres://m1_user:m1_password@localhost:5432/m1_db
      MIGRATE_DATABASE_URL: postgres://m1_user:m1_password@localhost:5432/m1_db
      TEST_DATABASE_URL: postgres://m1_user:m1_password@localhost:5432/m1_db
      JWT_SECRET: ci-test-secret-at-least-16-chars-long
      AUTH_STRICT: 'true'
      MIGRATE_STRICT_ORDER: '1'
      VITEST_DB_AVAILABLE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-npm
      - run: npm ci
      - run: node scripts/ensure-native-bindings.mjs
      - run: npm run build -w @m1/shared-validation
      - run: npm run build -w @zedral/platform
      - run: npm run build -w @zedral/connectors
      - run: npm run build -w @zedral/m1-collection
      - run: npm run build -w @m1/server
      - name: Migration filename order
        run: node packages/server/scripts/check-migration-order.mjs
      - name: Database migrations (strict order)
        working-directory: packages/server
        run: npm run migrate
      - name: Migrations up → down-all → up
        working-directory: packages/server
        run: |
          npm run migrate:down:all
          npm run migrate
      - name: db-types drift check
        working-directory: packages/server
        run: npm run db:codegen:check
      - name: Server integration tests
        run: npm run test:integration -w @m1/server

  arch:
    name: Architecture
    needs: [lockfile]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-npm
      - run: npm ci
      - run: node scripts/ensure-native-bindings.mjs
      - run: npm run build -w @m1/shared-validation
      - run: npm run build -w @zedral/platform
      - run: npm run build -w @zedral/connectors
      - run: npm run build -w @zedral/m1-collection
      - run: npm run build -w @m1/server
      - run: npm run arch:check

  secrets:
    name: Secrets (gitleaks)
    needs: [lockfile]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  audit:
    name: npm audit (report)
    needs: [lockfile]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-npm
      - run: npm ci
      - name: npm audit (prod critical — report, non-blocking)
        run: |
          npm audit --omit=dev --audit-level=critical 2>&1 | tee audit-critical.txt || true
          if grep -qi 'critical' audit-critical.txt; then
            echo "::warning::Prod-critical advisory present — review audit-critical.txt (not blocking the build)."
          fi
          {
            echo "## npm audit (prod critical)"
            echo ""
            echo '```'
            tail -n 40 audit-critical.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: npm audit (high+ report)
        run: |
          npm audit --audit-level=high 2>&1 | tee audit-high.txt || true
          {
            echo "## npm audit (high+)"
            echo ""
            echo '```'
            tail -n 40 audit-high.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  docker-pr:
    name: Docker build (PR)
    needs: [lockfile]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build backend (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: backend
          push: false
          load: true
          tags: zedral-backend:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Runtime require smoke
        run: |
          docker run --rm --entrypoint node zedral-backend:pr -e \
            "process.chdir('/app/packages/server'); require('zod'); require('pg'); require('express'); console.log('pr image ok')"

  docker-build-push:
    name: Docker build · Trivy · Push GHCR
    needs: [lockfile, lint, build, unit, integration, arch, secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      backend_image: ${{ steps.meta.outputs.backend }}
      nginx_image: ${{ steps.meta.outputs.nginx }}
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Image tags
        id: meta
        run: |
          TAG="${GITHUB_SHA}"
          {
            echo "tag=${TAG}"
            echo "backend=${IMAGE_PREFIX}/backend:${TAG}"
            echo "nginx=${IMAGE_PREFIX}/nginx:${TAG}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build backend (local, for scan)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: backend
          push: false
          load: true
          tags: zedral-backend:ci
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build nginx (local, for scan)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: nginx
          push: false
          load: true
          tags: zedral-nginx:ci
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate nginx /auth proxy (source + image)
        run: bash deploy/scripts/validate-nginx-auth-proxy.sh zedral-nginx:ci

      - name: Trivy scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: zedral-backend:ci
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          skip-files: '**/node_modules/esbuild/bin/esbuild,**/node_modules/@esbuild/**/esbuild'

      - name: Trivy scan nginx image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: zedral-nginx:ci
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push images to GHCR
        run: |
          set -euo pipefail
          TAG="${GITHUB_SHA}"

          docker tag zedral-backend:ci "${IMAGE_PREFIX}/backend:${TAG}"
          docker tag zedral-backend:ci "${IMAGE_PREFIX}/backend:latest-main"
          docker tag zedral-nginx:ci "${IMAGE_PREFIX}/nginx:${TAG}"
          docker tag zedral-nginx:ci "${IMAGE_PREFIX}/nginx:latest-main"

          docker push "${IMAGE_PREFIX}/backend:${TAG}"
          docker push "${IMAGE_PREFIX}/backend:latest-main"
          docker push "${IMAGE_PREFIX}/nginx:${TAG}"
          docker push "${IMAGE_PREFIX}/nginx:latest-main"

          {
            echo "## GHCR images (this commit)"
            echo ""
            echo "| Service | Tags |"
            echo "|---------|------|"
            echo "| backend | \`${IMAGE_PREFIX}/backend:${TAG}\` · \`latest-main\` |"
            echo "| nginx | \`${IMAGE_PREFIX}/nginx:${TAG}\` · \`latest-main\` |"
            echo ""
            echo "AWS QA auto-deploys the **SHA** tag after CI succeeds. Promote to Factory via **Deploy Production** (\`latest-main\`, SHA, or \`vX.Y.Z\`)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign images (cosign keyless)
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          TAG="${GITHUB_SHA}"
          cosign sign --yes "${IMAGE_PREFIX}/backend:${TAG}"
          cosign sign --yes "${IMAGE_PREFIX}/backend:latest-main"
          cosign sign --yes "${IMAGE_PREFIX}/nginx:${TAG}"
          cosign sign --yes "${IMAGE_PREFIX}/nginx:latest-main"
