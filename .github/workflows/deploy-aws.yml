name: Deploy to AWS EC2

on:
  workflow_dispatch:
    inputs:
      skip_migrate:
        description: Skip DB migrations on deploy
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    timeout-minutes: 30
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          AWS_GIT_DEPLOY_TOKEN: ${{ secrets.AWS_GIT_DEPLOY_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          APP_BASE: ${{ secrets.AWS_APP_DIR != '' && secrets.AWS_APP_DIR || '/opt/zedralv2' }}
          DEPLOY_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
          SKIP_MIGRATE: ${{ github.event.inputs.skip_migrate == 'true' && 'true' || 'false' }}
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          port: ${{ secrets.AWS_EC2_SSH_PORT || 22 }}
          envs: AWS_GIT_DEPLOY_TOKEN,GITHUB_REPO,APP_BASE,DEPLOY_REF,SKIP_MIGRATE
          script_stop: true
          script: |
            set -euo pipefail
            REF="${DEPLOY_REF}"
            FETCH_URL="https://raw.githubusercontent.com/${GITHUB_REPO}/${REF}/deploy/vm-deploy.sh"
            if [ -n "${AWS_GIT_DEPLOY_TOKEN:-}" ]; then
              curl -fsSL -H "Authorization: token ${AWS_GIT_DEPLOY_TOKEN}" "${FETCH_URL}" -o /tmp/zedral-vm-deploy.sh
            else
              curl -fsSL "${FETCH_URL}" -o /tmp/zedral-vm-deploy.sh
            fi
            chmod +x /tmp/zedral-vm-deploy.sh
            bash /tmp/zedral-vm-deploy.sh

      - name: External smoke test
        env:
          PUBLIC_URL: ${{ secrets.AWS_PUBLIC_URL }}
        run: |
          if [ -z "${PUBLIC_URL}" ]; then
            echo "AWS_PUBLIC_URL not set — skipping external smoke test"
            exit 0
          fi
          BASE="${PUBLIC_URL%/}"
          echo "Smoke testing ${BASE}/health …"
          for attempt in 1 2 3 4 5; do
            if curl -fsS "${BASE}/health" | head -c 200; then
              echo ""
              echo "External smoke test passed"
              exit 0
            fi
            echo "Attempt ${attempt} failed — retrying in 10s …"
            sleep 10
          done
          echo "External smoke test failed after 5 attempts"
          exit 1
