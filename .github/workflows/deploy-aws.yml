name: Deploy to AWS EC2 (deprecated)

# DEPRECATED — use deploy-staging.yml (GHCR pull-based staging).
# Kept temporarily so existing bookmarks/docs do not 404; remove after cutover.

on:
  workflow_dispatch:
    inputs:
      acknowledge:
        description: Type "use-deploy-staging" to confirm you know this is deprecated
        required: true
        type: string

jobs:
  redirect:
    runs-on: ubuntu-latest
    steps:
      - name: Deprecated
        run: |
          echo "::error::deploy-aws.yml is deprecated. Use workflow 'Deploy Staging (AWS)' (.github/workflows/deploy-staging.yml)."
          if [ "${{ github.event.inputs.acknowledge }}" != "use-deploy-staging" ]; then
            exit 1
          fi
          echo "Acknowledged — please migrate secrets to staging environment and run deploy-staging.yml."
          exit 1
