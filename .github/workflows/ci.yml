name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Test · Security
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: m1_user
          POSTGRES_PASSWORD: m1_password
          POSTGRES_DB: m1_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U m1_user -d m1_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: m1_user
      DB_PASSWORD: m1_password
      DB_NAME: m1_db
      DATABASE_URL: postgres://m1_user:m1_password@localhost:5432/m1_db
      TEST_DATABASE_URL: postgres://m1_user:m1_password@localhost:5432/m1_db
      JWT_SECRET: ci-test-secret-at-least-16-chars-long
      AUTH_STRICT: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Typecheck / build all workspaces
        run: npm run build

      - name: Client unit tests
        run: npm run test -w @m1/client

      - name: Operator APK bundle check
        run: npm run check:operator-bundle -w @m1/client

      - name: Database migrations
        working-directory: packages/server
        run: npm run migrate

      - name: Server unit tests
        run: npm run test:unit -w @m1/server

      - name: Server integration tests
        run: npm run test:integration -w @m1/server

      - name: npm audit (high+)
        run: npm audit --audit-level=high
        continue-on-error: true

  docker-validate:
    name: Docker build validation
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: backend
          push: false
          load: true
          tags: zedral-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build nginx (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: nginx
          push: false
          load: true
          tags: zedral-nginx:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # v-prefix required after aquasecurity tag remediation (0.28.0 no longer exists)
      - name: Trivy scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: zedral-backend:ci
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          # Runtime image is Node; skip unused Go toolchains (esbuild) if still present
          skip-files: '**/node_modules/esbuild/bin/esbuild,**/node_modules/@esbuild/**/esbuild'
