name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: m1_user
          POSTGRES_PASSWORD: m1_password
          POSTGRES_DB: m1_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U m1_user -d m1_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: m1_user
      DB_PASSWORD: m1_password
      DB_NAME: m1_db
      DATABASE_URL: postgres://m1_user:m1_password@localhost:5432/m1_db
      TEST_DATABASE_URL: postgres://m1_user:m1_password@localhost:5432/m1_db
      JWT_SECRET: ci-test-secret-at-least-16-chars-long
      AUTH_STRICT: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all workspaces
        run: npm run build

      - name: Client tests
        run: npm run test -w @m1/client

      - name: Operator APK bundle (manual stoppage + CRM surface)
        run: npm run check:operator-bundle -w @m1/client

      - name: Run database migrations
        working-directory: packages/server
        run: npm run migrate

      - name: Server unit tests
        run: npm run test:unit -w @m1/server

      - name: Server integration tests
        run: npm run test:integration -w @m1/server

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: backend
          push: false
          tags: zedralv2-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: nginx
          push: false
          tags: zedralv2-nginx:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
