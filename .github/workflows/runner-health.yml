name: Runner health

# Alert if self-hosted QA / Factory runners go offline (stuck deploys).
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  check:
    name: Check self-hosted runners
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read        # actions/checkout
      administration: read  # GET /repos/{}/actions/runners
    steps:
      - name: Checkout (notify script)
        uses: actions/checkout@v5

      - name: List runners · alert if offline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          NEEDLE_QA='zedral-aws-qa'
          NEEDLE_FACTORY='hslsmed'
          JSON="$(gh api "repos/${{ github.repository }}/actions/runners" --paginate)"
          echo "$JSON" | jq -r '.runners[] | "\(.name)\t\(.status)\t\(.busy)\t\(.labels|map(.name)|join(","))"' || true

          offline=()
          for label in "$NEEDLE_QA" "$NEEDLE_FACTORY"; do
            hit="$(echo "$JSON" | jq -r --arg l "$label" '
              [.runners[] | select(.labels[]?.name == $l) | {name, status, busy}] | first // empty
            ')"
            if [ -z "$hit" ] || [ "$hit" = "null" ]; then
              echo "::warning::No runner with label ${label}"
              offline+=("missing:${label}")
              continue
            fi
            status="$(echo "$hit" | jq -r '.status')"
            name="$(echo "$hit" | jq -r '.name')"
            echo "Runner label=${label} name=${name} status=${status}"
            if [ "$status" != "online" ]; then
              offline+=("${label}:${name}:${status}")
            fi
          done

          if [ "${#offline[@]}" -gt 0 ]; then
            msg="Self-hosted runners offline or missing: ${offline[*]}"
            echo "::error::${msg}"
            bash deploy/scripts/notify-deploy.sh failed "${msg}"
            exit 1
          fi
          echo "All expected runners online."
