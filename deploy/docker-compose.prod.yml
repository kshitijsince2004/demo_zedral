# Production stack for a single AWS EC2 VM (or any Docker host).
# Usage: docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build

services:
  db:
    image: postgres:15-alpine
    container_name: zedral-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - zedral

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
      target: backend
    container_name: zedral-backend
    environment:
      NODE_ENV: production
      PORT: 3005
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_STRICT: ${AUTH_STRICT:-true}
      VALIDATION_STRICT: ${VALIDATION_STRICT:-true}
      TENANT_ID: ${TENANT_ID}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      EXPORT_WORKER_ENABLED: ${EXPORT_WORKER_ENABLED:-true}
      DPR_SCHEDULER_ENABLED: ${DPR_SCHEDULER_ENABLED:-true}
      SHIFT_BOUNDARY_SCHEDULER_ENABLED: ${SHIFT_BOUNDARY_SCHEDULER_ENABLED:-true}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3005/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - zedral

  nginx:
    build:
      context: ..
      dockerfile: Dockerfile
      target: nginx
    container_name: zedral-nginx
    ports:
      - "${DOCKER_HTTP_BIND:-0.0.0.0:80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - zedral

networks:
  zedral:
    driver: bridge

volumes:
  pg_data:
