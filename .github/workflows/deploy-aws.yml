name: Deploy to AWS EC2

on:
  workflow_dispatch:
    inputs:
      skip_migrate:
        description: Skip DB migrations on deploy
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  deploy:
    # Runs on EC2 self-hosted runner — no inbound SSH from GitHub cloud required.
    # One-time setup: deploy/setup-github-runner.sh (see deploy/README.md)
    runs-on: [self-hosted, linux, zedral]
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    timeout-minutes: 30
    environment: production

    steps:
      - name: Deploy application
        env:
          GIT_DEPLOY_TOKEN: ${{ secrets.AWS_GIT_DEPLOY_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          APP_BASE: ${{ secrets.AWS_APP_DIR != '' && secrets.AWS_APP_DIR || '/opt/zedralv2' }}
          DEPLOY_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
          SKIP_MIGRATE: ${{ github.event.inputs.skip_migrate == 'true' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          export APP_BASE DEPLOY_REF SKIP_MIGRATE GITHUB_REPO GIT_DEPLOY_TOKEN

          if [ -z "${GIT_DEPLOY_TOKEN:-}" ]; then
            echo "::warning::AWS_GIT_DEPLOY_TOKEN not set — private repo fetch may fail"
          fi

          DEPLOY_SCRIPT="${APP_BASE}/deploy/vm-deploy.sh"
          if [ -f "${DEPLOY_SCRIPT}" ]; then
            echo "Using on-disk deploy script: ${DEPLOY_SCRIPT}"
            bash "${DEPLOY_SCRIPT}"
            exit 0
          fi

          REF="${DEPLOY_REF}"
          FETCH_URL="https://raw.githubusercontent.com/${GITHUB_REPO}/${REF}/deploy/vm-deploy.sh"
          CURL_OPTS=(-fsSL)
          if [ -n "${GIT_DEPLOY_TOKEN:-}" ]; then
            CURL_OPTS+=(-H "Authorization: token ${GIT_DEPLOY_TOKEN}")
          fi
          curl "${CURL_OPTS[@]}" "${FETCH_URL}" -o /tmp/zedral-vm-deploy.sh
          chmod +x /tmp/zedral-vm-deploy.sh
          bash /tmp/zedral-vm-deploy.sh

      - name: Local health check
        run: |
          echo "Smoke testing http://127.0.0.1/health …"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "http://127.0.0.1/health" | head -c 200; then
              echo ""
              echo "Local health check passed"
              exit 0
            fi
            echo "Attempt ${attempt}/6 failed — retrying in 10s …"
            sleep 10
          done
          echo "Local health check failed"
          exit 1

      - name: External smoke test
        env:
          PUBLIC_URL: ${{ secrets.AWS_PUBLIC_URL }}
        run: |
          if [ -z "${PUBLIC_URL}" ]; then
            echo "AWS_PUBLIC_URL not set — skipping external smoke test"
            exit 0
          fi
          BASE="${PUBLIC_URL%/}"
          echo "Smoke testing ${BASE}/health …"
          for attempt in 1 2 3 4 5; do
            if curl -fsS "${BASE}/health" | head -c 200; then
              echo ""
              echo "External smoke test passed"
              exit 0
            fi
            echo "Attempt ${attempt} failed — retrying in 10s …"
            sleep 10
          done
          echo "External smoke test failed after 5 attempts"
          exit 1
