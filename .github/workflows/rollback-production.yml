name: Rollback Production (Factory)

# Manual, pull-only rollback for the Factory production box.
# Re-deploys an EXISTING known-good GHCR image tag. Requires the FULL 40-char git SHA
# so Factory can sync that era's deploy/compose (not today's main wiring).
# Never builds. Runs docker/compose LOCALLY on the Factory self-hosted runner.
# Takes a DB backup before switching and auto-restores the previous image pair if the
# rollback itself fails. Does NOT touch AWS QA (separate runner/box). Shares the
# `deploy-production` concurrency group so it can never run at the same time as a deploy.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Full 40-char git SHA GHCR tag (era-matched deploy checkout; not latest-main / SemVer)'
        required: true
        type: string
      reason:
        description: 'Why are you rolling back? (audit trail)'
        required: true
        type: string
      skip_migrate:
        description: 'Skip DB migrations (default true — recommended for a rollback)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

concurrency:
  group: deploy-production   # shared with Deploy Production — mutually exclusive
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  resolve-images:
    name: Verify rollback tag in GHCR (no rebuild)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      backend_image: ${{ steps.meta.outputs.backend }}
      nginx_image: ${{ steps.meta.outputs.nginx }}
      image_tag: ${{ steps.meta.outputs.tag }}
      checkout_ref: ${{ steps.meta.outputs.checkout }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify tag exists (fail fast, never build)
        id: meta
        run: |
          set -euo pipefail
          SRC="$(echo -n '${{ github.event.inputs.image_tag }}' | tr -d '[:space:]')"
          if [ -z "${SRC}" ]; then
            echo "::error::image_tag is empty"
            exit 1
          fi
          # Era-matched deploy/ requires a full git SHA (old compose vs today's m1_app wiring).
          if ! printf '%s' "${SRC}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::image_tag must be the full 40-char git SHA (got '${SRC}'). Do not use latest-main or SemVer — Factory must sync deploy/compose from that commit."
            exit 1
          fi
          echo "Rolling back to tag=${SRC} — verifying it exists in GHCR"
          if ! docker buildx imagetools inspect "${IMAGE_PREFIX}/backend:${SRC}" >/dev/null 2>&1; then
            echo "::error::${IMAGE_PREFIX}/backend:${SRC} not found in GHCR. It may have been pruned by retention — you cannot roll back to a tag that no longer exists. Rebuild that commit or pick a tag still present."
            exit 1
          fi
          docker buildx imagetools inspect "${IMAGE_PREFIX}/nginx:${SRC}" >/dev/null
          {
            echo "tag=${SRC}"
            echo "checkout=${SRC}"
            echo "backend=${IMAGE_PREFIX}/backend:${SRC}"
            echo "nginx=${IMAGE_PREFIX}/nginx:${SRC}"
          } >> "$GITHUB_OUTPUT"
          echo "Factory will roll back to tag=${SRC} with era-matched deploy checkout"

      - name: Notify started
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          bash deploy/scripts/notify-deploy.sh started \
            "ROLLBACK Production tag=${{ steps.meta.outputs.tag }} -> Factory | reason: ${{ github.event.inputs.reason }}"

  rollback-factory:
    name: Roll back Factory (self-hosted)
    needs: resolve-images
    runs-on: [self-hosted, linux, hslsmed]
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout era-matched deploy scripts
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-images.outputs.checkout_ref }}

      - name: Resolve APP_DIR
        id: appdir
        env:
          APP_DIR: ${{ secrets.FACTORY_APP_DIR }}
        run: |
          if [ -z "${APP_DIR:-}" ] || [ "${APP_DIR}" = "/" ]; then APP_DIR="/opt/zedral"; fi
          echo "dir=${APP_DIR}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR (local docker daemon)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync deploy/ into APP_DIR (preserve .env + checkpoints)
        env:
          APP_DIR: ${{ steps.appdir.outputs.dir }}
        run: |
          set -euo pipefail
          mkdir -p "${APP_DIR}/deploy"
          rsync -az --no-o --no-g --delete \
            --exclude '.env' \
            --exclude 'secrets/' \
            --exclude '.last-good-*' \
            --exclude '.previous-good-*' \
            ./deploy/ "${APP_DIR}/deploy/"

      - name: Backup DB · pull known-good images · deploy (local)
        env:
          APP_DIR: ${{ steps.appdir.outputs.dir }}
          BACKEND_IMAGE: ${{ needs.resolve-images.outputs.backend_image }}
          NGINX_IMAGE: ${{ needs.resolve-images.outputs.nginx_image }}
          SKIP_MIGRATE: ${{ github.event.inputs.skip_migrate == 'false' && 'false' || 'true' }}
          # Older images may not expose routes added later (e.g. /api/tenant-flags).
          # Health check still runs; only the current-API route asserts are skipped.
          SKIP_ROUTE_ASSERT: 'true'
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export BACKEND_IMAGE NGINX_IMAGE SKIP_MIGRATE SKIP_ROUTE_ASSERT \
                 APP_BASE="${APP_DIR}" RUN_BACKUP=true VERIFY_BACKUP=true \
                 GHCR_USER GHCR_TOKEN
          bash "${APP_DIR}/deploy/scripts/remote-ghcr-deploy.sh"

      - name: Health check (curl /health)
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6 8 10; do
            if curl -fsS http://127.0.0.1/health | head -c 200; then
              echo ''; echo 'Factory health check passed'; exit 0
            fi
            echo "Attempt ${attempt} failed — retrying in 10s…"
            sleep 10
          done
          echo 'Factory health check failed'
          exit 1

      - name: Verify containers
        run: docker ps --filter name=zedral- --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"

      - name: Collect logs on failure
        if: failure()
        env:
          APP_DIR: ${{ steps.appdir.outputs.dir }}
        run: |
          mkdir -p artifacts
          docker compose -f "${APP_DIR}/deploy/docker-compose.prod.yml" \
            --env-file "${APP_DIR}/deploy/.env" logs --tail 200 > artifacts/factory-rollback-logs.txt || true

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: factory-rollback-logs
          path: artifacts/
          if-no-files-found: ignore

      - name: Auto-restore previous images if rollback failed
        if: failure()
        env:
          APP_DIR: ${{ steps.appdir.outputs.dir }}
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          export APP_BASE="${APP_DIR}"
          bash "${APP_DIR}/deploy/scripts/rollback-images.sh" || true
          bash deploy/scripts/notify-deploy.sh rollback \
            "Factory auto-restored previous images after FAILED rollback to ${{ needs.resolve-images.outputs.image_tag }}"

      - name: Notify success
        if: success()
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          bash deploy/scripts/notify-deploy.sh success \
            "Factory ROLLBACK OK tag=${{ needs.resolve-images.outputs.image_tag }} | reason: ${{ github.event.inputs.reason }}"

      - name: Notify failure
        if: failure()
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          bash deploy/scripts/notify-deploy.sh failed \
            "Factory ROLLBACK FAILED tag=${{ needs.resolve-images.outputs.image_tag }}"
