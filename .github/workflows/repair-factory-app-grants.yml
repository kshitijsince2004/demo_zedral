name: Repair Factory App Grants

# Manual, Actions-only repair when Factory login/API returns 500 because
# m1_app lacks USAGE on schema security (permission denied for schema security).
# Runs on the Factory self-hosted runner — no laptop SSH required.
# Does NOT touch AWS QA. Shares deploy-production concurrency with Deploy Production.
#
# IMPORTANT: never `source` / `.' deploy/.env in bash — Factory .env values can contain
# '(' and other metacharacters (Repair #1/#2 failed that way). Pass --env-file to compose
# only; read POSTGRES_USER / POSTGRES_DB from inside the db container.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you repairing grants? (audit trail)'
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  repair-grants:
    name: Re-grant m1_app schema privileges
    runs-on: [self-hosted, linux, hslsmed]
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve APP_DIR
        id: appdir
        env:
          APP_DIR: ${{ secrets.FACTORY_APP_DIR }}
        run: |
          if [ -z "${APP_DIR:-}" ] || [ "${APP_DIR}" = "/" ]; then APP_DIR="/opt/zedral"; fi
          echo "dir=${APP_DIR}" >> "$GITHUB_OUTPUT"
          if [ ! -f "${APP_DIR}/deploy/.env" ]; then
            echo "::error::Missing ${APP_DIR}/deploy/.env"
            exit 1
          fi
          if [ ! -f "${APP_DIR}/deploy/docker-compose.prod.yml" ]; then
            echo "::error::Missing ${APP_DIR}/deploy/docker-compose.prod.yml"
            exit 1
          fi

      - name: Show current schema USAGE for m1_app
        env:
          APP_DIR: ${{ steps.appdir.outputs.dir }}
        run: |
          set -euo pipefail
          echo "Repair reason: ${{ github.event.inputs.reason }}"
          docker compose -f "${APP_DIR}/deploy/docker-compose.prod.yml" \
            --env-file "${APP_DIR}/deploy/.env" exec -T db \
            printenv POSTGRES_USER POSTGRES_DB
          docker compose -f "${APP_DIR}/deploy/docker-compose.prod.yml" \
            --env-file "${APP_DIR}/deploy/.env" exec -T db \
            sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -c "SELECT has_schema_privilege('\''m1_app'\'','\''security'\'','\''USAGE'\'') AS security_usage, has_schema_privilege('\''m1_app'\'','\''master'\'','\''USAGE'\'') AS master_usage, has_schema_privilege('\''m1_app'\'','\''txn'\'','\''USAGE'\'') AS txn_usage;"' \
            || true

      - name: GRANT m1_app schemas (1797-equivalent)
        env:
          APP_DIR: ${{ steps.appdir.outputs.dir }}
        run: |
          set -euo pipefail
          SQL_FILE="$(mktemp)"
          cat > "${SQL_FILE}" <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'm1_app') THEN
              RAISE EXCEPTION 'role m1_app does not exist';
            END IF;
          END
          $$;

          DO $$
          DECLARE
            s text;
          BEGIN
            FOREACH s IN ARRAY ARRAY['master', 'coil', 'security', 'txn', 'planning', 'audit']
            LOOP
              IF EXISTS (SELECT 1 FROM pg_namespace WHERE nspname = s) THEN
                EXECUTE format('GRANT USAGE ON SCHEMA %I TO m1_app', s);
                EXECUTE format('GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA %I TO m1_app', s);
                EXECUTE format('GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA %I TO m1_app', s);
                RAISE NOTICE 'granted schema % to m1_app', s;
              ELSE
                RAISE NOTICE 'skip missing schema %', s;
              END IF;
            END LOOP;
          END
          $$;

          DO $$
          BEGIN
            IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'm1_user') THEN
              ALTER DEFAULT PRIVILEGES FOR ROLE m1_user IN SCHEMA master
                GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO m1_app;
              ALTER DEFAULT PRIVILEGES FOR ROLE m1_user IN SCHEMA coil
                GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO m1_app;
              ALTER DEFAULT PRIVILEGES FOR ROLE m1_user IN SCHEMA security
                GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO m1_app;
              ALTER DEFAULT PRIVILEGES FOR ROLE m1_user IN SCHEMA txn
                GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO m1_app;
              ALTER DEFAULT PRIVILEGES FOR ROLE m1_user IN SCHEMA planning
                GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO m1_app;
              ALTER DEFAULT PRIVILEGES FOR ROLE m1_user IN SCHEMA audit
                GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO m1_app;
              ALTER DEFAULT PRIVILEGES FOR ROLE m1_user IN SCHEMA master
                GRANT USAGE, SELECT ON SEQUENCES TO m1_app;
              ALTER DEFAULT PRIVILEGES FOR ROLE m1_user IN SCHEMA coil
                GRANT USAGE, SELECT ON SEQUENCES TO m1_app;
              ALTER DEFAULT PRIVILEGES FOR ROLE m1_user IN SCHEMA security
                GRANT USAGE, SELECT ON SEQUENCES TO m1_app;
              ALTER DEFAULT PRIVILEGES FOR ROLE m1_user IN SCHEMA txn
                GRANT USAGE, SELECT ON SEQUENCES TO m1_app;
              ALTER DEFAULT PRIVILEGES FOR ROLE m1_user IN SCHEMA planning
                GRANT USAGE, SELECT ON SEQUENCES TO m1_app;
              ALTER DEFAULT PRIVILEGES FOR ROLE m1_user IN SCHEMA audit
                GRANT USAGE, SELECT ON SEQUENCES TO m1_app;
            END IF;
          EXCEPTION WHEN OTHERS THEN
            RAISE NOTICE 'default privileges skipped: %', SQLERRM;
          END
          $$;

          SELECT has_schema_privilege('m1_app', 'security', 'USAGE') AS security_usage_after;
          SQL
          echo "Running grants via db container POSTGRES_USER/POSTGRES_DB (not sourcing .env)…"
          docker compose -f "${APP_DIR}/deploy/docker-compose.prod.yml" \
            --env-file "${APP_DIR}/deploy/.env" exec -T db \
            sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -f -' \
            < "${SQL_FILE}"
          rm -f "${SQL_FILE}"

      - name: Restart backend and health-check
        env:
          APP_DIR: ${{ steps.appdir.outputs.dir }}
        run: |
          set -euo pipefail
          docker compose -f "${APP_DIR}/deploy/docker-compose.prod.yml" \
            --env-file "${APP_DIR}/deploy/.env" restart backend
          for attempt in 1 2 3 4 5 6 8 10; do
            if curl -fsS http://127.0.0.1/health | head -c 200; then
              echo ''
              echo 'Factory health check passed after grants repair'
              exit 0
            fi
            echo "Attempt ${attempt} failed — retrying in 10s…"
            sleep 10
          done
          echo 'Factory health check failed after grants repair'
          exit 1

      - name: Notify
        if: always()
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            bash deploy/scripts/notify-deploy.sh success \
              "Factory app grants repair OK | reason: ${{ github.event.inputs.reason }}"
          else
            bash deploy/scripts/notify-deploy.sh failed \
              "Factory app grants repair FAILED | reason: ${{ github.event.inputs.reason }}"
          fi
