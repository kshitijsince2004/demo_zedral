worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  keepalive_timeout 65;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

  upstream backend {
    server backend:3005;
  }

  server {
    listen 80;
    server_name _;

    # Security headers (TLS/HSTS configured on host reverse proxy — see TLS_DEPLOYMENT_GUIDE.md)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /usr/share/nginx/html;
    index index.html;

    # PWA icons — never fall back to index.html (invalid image in manifest)
    location ~ ^/pwa-.*\.png$ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=86400";
    }

    # API — strip /api prefix (matches Vite dev proxy contract)
    location /api/ {
      proxy_pass http://backend/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Tenant-Id $http_x_tenant_id;
      proxy_read_timeout 300s;
      client_max_body_size 50m;
    }

    # Health via nginx (proxied)
    location = /health {
      proxy_pass http://backend/health;
      proxy_set_header Host $host;
    }

    # PWA service worker + assets
    location /assets/ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
