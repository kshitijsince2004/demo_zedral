apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace = "com.zedral.m1operator"
    compileSdk rootProject.ext.appCompileSdkVersion
    defaultConfig {
        applicationId "com.zedral.m1operator"
        minSdk rootProject.ext.appMinSdkVersion
        targetSdk rootProject.ext.appTargetSdkVersion
        versionCode providers.environmentVariable("ZEDRAL_VERSION_CODE").getOrElse("10").toInteger()
        versionName "1.2.7"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    
    buildFeatures {
        compose true
    }

    // Release signing only when all env vars are set; otherwise debug (local/dev APKs).
    def releaseStorePass = providers.environmentVariable("ZEDRAL_KEYSTORE_PASS").getOrNull()
    def releaseKeyAlias = providers.environmentVariable("ZEDRAL_KEY_ALIAS").getOrNull()
    def releaseKeyPass = providers.environmentVariable("ZEDRAL_KEY_PASS").getOrNull()
    def releaseStoreFile = providers.environmentVariable("ZEDRAL_KEYSTORE_PATH").getOrNull()
    def hasReleaseSigning = releaseStoreFile && releaseStorePass && releaseKeyAlias && releaseKeyPass

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePass
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPass
            }
        }
    }
    buildTypes {
        release {
            // ponytail: debug-signed release when keystore env missing — fleet builds must set ZEDRAL_KEYSTORE_*
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    
    // Compose
    implementation platform("androidx.compose:compose-bom:2024.12.01")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material3:material3-window-size-class"
    implementation "androidx.activity:activity-compose:$androidxActivityVersion"

    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
