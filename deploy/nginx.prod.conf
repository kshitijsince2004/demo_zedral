# PERF-F1: alpine nginx-mod-http-brotli (see Dockerfile nginx stage; ABI-mismatched on nginx:official)
load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  keepalive_timeout 65;
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_min_length 256;
  gzip_comp_level 5;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
  brotli on;
  brotli_comp_level 5;
  brotli_types text/plain text/css application/json application/javascript text/xml application/xml;

  # Docker embedded DNS. Variable proxy_pass re-resolves `backend` after
  # container recreate (static `upstream { server backend:3005; }` sticks forever).
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    server_name _;

    # Security headers (TLS/HSTS configured on host reverse proxy — see TLS_DEPLOYMENT_GUIDE.md)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /usr/share/nginx/html;
    index index.html;

    # PWA icons — never fall back to index.html (invalid image in manifest)
    location ~ ^/pwa-.*\.png$ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=86400";
    }

    # API — strip /api prefix (browser /api/… → Express /…).
    # Variable proxy_pass WITH a URI replaces the *entire* request URI, so
    #   proxy_pass http://$backend_upstream/;
    # turns /api/6hi/queue into "/" → "Cannot GET /". Keep variable upstream
    # for Docker DNS re-resolve; strip the prefix with rewrite instead.
    location /api/ {
      set $backend_upstream backend:3005;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://$backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Tenant-Id $http_x_tenant_id;
      proxy_set_header Authorization $http_authorization;
      proxy_read_timeout 300s;
      client_max_body_size 50m;
    }

    # Auth — preserve full URI (/auth/badge-pin, /auth/session/refresh, …).
    # With a *variable* proxy_pass, a URI path replaces the entire request URI
    # (not just the location prefix). Do NOT use:
    #   proxy_pass http://$backend_upstream/auth/;
    # or the backend receives only "/auth/" and returns 404.
    location /auth/ {
      set $backend_upstream backend:3005;
      proxy_pass http://$backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
      proxy_read_timeout 300s;
      client_max_body_size 50m;
    }

    # Health via nginx (proxied) — must survive backend IP changes
    location = /health {
      set $backend_upstream backend:3005;
      proxy_pass http://$backend_upstream/health;
      proxy_set_header Host $host;
    }

    # PWA service worker + assets
    location /assets/ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }
  }
}
