name: Deploy AWS QA

# Self-hosted runner model: the runner lives ON the AWS QA server.
# Deploy runs docker/compose LOCALLY on that box — no SSH, ssh-agent, keyscan, or rsync-over-SSH.
# Still pull-only: uses the SAME commit SHA images CI pushed to GHCR. Never builds source.
# Triggered after CI succeeds on main (workflow_run), not bare push — avoids racing GHCR push.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: GHCR image tag (git SHA). Leave empty to use latest-main.
        required: false
        type: string
        default: ''
      skip_migrate:
        description: Skip DB migrations
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      skip_smoke:
        description: Skip Playwright smoke tests
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: deploy-aws-qa
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  # ── Resolve which GHCR tag to deploy (GitHub-hosted; only needs GHCR API) ─────
  resolve:
    name: Resolve CI image tag
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      backend_image: ${{ steps.meta.outputs.backend }}
      nginx_image: ${{ steps.meta.outputs.nginx }}
      commit_sha: ${{ steps.meta.outputs.sha }}
    permissions:
      contents: read
      packages: read

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag from CI or dispatch
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            TAG="${{ github.event.workflow_run.head_sha }}"
            SHA="${TAG}"
          elif [ -n "${{ github.event.inputs.image_tag }}" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
            if [[ "${TAG}" =~ ^[0-9a-f]{40}$ ]]; then
              SHA="${TAG}"
            else
              SHA="$(docker buildx imagetools inspect "${IMAGE_PREFIX}/backend:${TAG}" 2>/dev/null \
                | sed -n 's/.*org\.opencontainers\.image\.revision: *\([0-9a-f]\{40\}\).*/\1/p' \
                | head -1 || true)"
              if [ -z "${SHA}" ]; then
                SHA="${{ github.sha }}"
                echo "::warning::No OCI revision on tag=${TAG}; using workflow SHA ${SHA}"
              fi
            fi
          else
            TAG="latest-main"
            SHA="$(docker buildx imagetools inspect "${IMAGE_PREFIX}/backend:latest-main" 2>/dev/null \
              | sed -n 's/.*org\.opencontainers\.image\.revision: *\([0-9a-f]\{40\}\).*/\1/p' \
              | head -1 || true)"
            if [ -z "${SHA}" ]; then
              SHA="${{ github.sha }}"
            fi
          fi
          echo "Inspecting GHCR images for tag=${TAG}"
          if ! docker buildx imagetools inspect "${IMAGE_PREFIX}/backend:${TAG}" >/dev/null; then
            echo "::error::${IMAGE_PREFIX}/backend:${TAG} not in GHCR. Wait for CI job 'Docker build · Trivy · Push GHCR'."
            exit 1
          fi
          if ! docker buildx imagetools inspect "${IMAGE_PREFIX}/nginx:${TAG}" >/dev/null; then
            echo "::error::${IMAGE_PREFIX}/nginx:${TAG} not in GHCR. Wait for CI job 'Docker build · Trivy · Push GHCR'."
            exit 1
          fi
          {
            echo "tag=${TAG}"
            echo "sha=${SHA}"
            echo "backend=${IMAGE_PREFIX}/backend:${TAG}"
            echo "nginx=${IMAGE_PREFIX}/nginx:${TAG}"
          } >> "$GITHUB_OUTPUT"
          echo "Deploying backend=${IMAGE_PREFIX}/backend:${TAG} (checkout ${SHA})"

  # ── Deploy runs ON the AWS QA box (self-hosted runner, label: aws-qa) ─────────
  deploy:
    name: Deploy to AWS QA (self-hosted)
    needs: resolve
    runs-on: [self-hosted, linux, zedral-aws-qa]
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout deploy scripts
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.commit_sha }}

      - name: Resolve APP_DIR
        id: appdir
        env:
          APP_DIR: ${{ secrets.AWS_APP_DIR }}
        run: |
          if [ -z "${APP_DIR:-}" ] || [ "${APP_DIR}" = "/" ]; then APP_DIR="/opt/zedral"; fi
          echo "dir=${APP_DIR}" >> "$GITHUB_OUTPUT"
          echo "APP_DIR=${APP_DIR}"

      - name: Notify started
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          bash deploy/scripts/notify-deploy.sh started \
            "AWS QA deploy tag=${{ needs.resolve.outputs.image_tag }}"

      - name: Login to GHCR (local docker daemon)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync deploy/ into APP_DIR (preserve remote .env + checkpoints)
        env:
          APP_DIR: ${{ steps.appdir.outputs.dir }}
        run: |
          set -euo pipefail
          mkdir -p "${APP_DIR}/deploy"
          rsync -az --no-o --no-g --delete \
            --exclude '.env' \
            --exclude '.last-good-*' \
            --exclude '.previous-good-*' \
            ./deploy/ "${APP_DIR}/deploy/"

      - name: Pull GHCR images · compose up · migrate
        id: deploy
        env:
          APP_DIR: ${{ steps.appdir.outputs.dir }}
          BACKEND_IMAGE: ${{ needs.resolve.outputs.backend_image }}
          NGINX_IMAGE: ${{ needs.resolve.outputs.nginx_image }}
          SKIP_MIGRATE: ${{ github.event.inputs.skip_migrate == 'true' && 'true' || 'false' }}
          # Sync SuperTokens/CORS to the public QA host; seed badge 3000 for smoke.
          AWS_PUBLIC_URL: ${{ secrets.AWS_PUBLIC_URL }}
          PUBLIC_BASE_URL: ${{ secrets.AWS_PUBLIC_URL }}
          ENSURE_SMOKE_USERS: 'true'
          SMOKE_BADGE_ID: ${{ secrets.SMOKE_BADGE_ID }}
          SMOKE_PIN: ${{ secrets.SMOKE_PIN }}
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export BACKEND_IMAGE NGINX_IMAGE SKIP_MIGRATE \
                 APP_BASE="${APP_DIR}" RUN_BACKUP=false \
                 AWS_PUBLIC_URL PUBLIC_BASE_URL ENSURE_SMOKE_USERS SMOKE_BADGE_ID SMOKE_PIN \
                 GHCR_USER GHCR_TOKEN
          bash "${APP_DIR}/deploy/scripts/remote-ghcr-deploy.sh"

      - name: Local health check (curl /health)
        env:
          APP_DIR: ${{ steps.appdir.outputs.dir }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS http://127.0.0.1/health | head -c 200; then
              echo ''; echo 'Health check passed'; exit 0
            fi
            echo "Attempt ${attempt}/6 failed — retrying in 10s…"
            sleep 10
          done
          echo 'Health check failed'
          docker compose -f "${APP_DIR}/deploy/docker-compose.prod.yml" \
            --env-file "${APP_DIR}/deploy/.env" logs --tail 80 backend nginx || true
          exit 1

      - name: Collect logs on failure
        if: failure()
        env:
          APP_DIR: ${{ steps.appdir.outputs.dir }}
        run: |
          mkdir -p artifacts
          docker compose -f "${APP_DIR}/deploy/docker-compose.prod.yml" \
            --env-file "${APP_DIR}/deploy/.env" logs --tail 200 backend nginx db \
            > artifacts/docker-logs.txt || true

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aws-qa-deploy-logs
          path: artifacts/
          if-no-files-found: ignore

      - name: Auto rollback images on deploy failure
        if: failure()
        env:
          APP_DIR: ${{ steps.appdir.outputs.dir }}
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          export APP_BASE="${APP_DIR}"
          bash "${APP_DIR}/deploy/scripts/rollback-images.sh" || true
          bash deploy/scripts/notify-deploy.sh rollback \
            "AWS QA auto-rollback after deploy failure (${{ needs.resolve.outputs.image_tag }})"

  # ── Smoke stays GitHub-hosted: only needs network to the public URL ──────────
  smoke:
    name: Playwright smoke tests
    needs: [resolve, deploy]
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.skip_smoke != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    outputs:
      rollback_safe: ${{ steps.gate.outputs.rollback_safe }}
      failure_kind: ${{ steps.gate.outputs.failure_kind }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.commit_sha }}

      - name: Smoke preflight (secrets + public /health)
        id: gate
        env:
          BASE_URL: ${{ secrets.AWS_PUBLIC_URL }}
          SMOKE_BADGE_ID: ${{ secrets.SMOKE_BADGE_ID }}
          SMOKE_PIN: ${{ secrets.SMOKE_PIN }}
        run: |
          set -euo pipefail
          # Default: config/CDN issues must NOT roll back a healthy local deploy.
          {
            echo "rollback_safe=false"
            echo "failure_kind=config"
          } >> "$GITHUB_OUTPUT"

          if [ -z "${BASE_URL:-}" ]; then
            echo "::error::AWS_PUBLIC_URL secret required for Playwright smoke (e.g. https://qa.zedral.com)"
            exit 1
          fi
          if [ -z "${SMOKE_BADGE_ID:-}" ] || [ -z "${SMOKE_PIN:-}" ]; then
            echo "::error::SMOKE_BADGE_ID and SMOKE_PIN staging secrets are required."
            echo "::error::Use a seeded pilot badge (e.g. 3000) and PIN (default seed PIN 5678). Do not leave empty — there is no safe 1001 default."
            exit 1
          fi
          # GitHub secret UI often appends a newline — strip before Playwright + length check.
          SMOKE_BADGE_ID="$(printf '%s' "${SMOKE_BADGE_ID}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          SMOKE_PIN="$(printf '%s' "${SMOKE_PIN}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          export SMOKE_BADGE_ID SMOKE_PIN
          if ! printf '%s' "${SMOKE_PIN}" | grep -Eq '^[0-9]{4}$'; then
            echo "::error::SMOKE_PIN must be exactly 4 digits after trim (got length=${#SMOKE_PIN})."
            exit 1
          fi

          host="$(printf '%s' "${BASE_URL}" | sed -E 's#^https?://##; s#/.*##')"
          echo "Smoke target: ${host} (badge=${SMOKE_BADGE_ID})"
          # Overwrites rollback_safe / failure_kind (cdn → false; app /health fail → true+app).
          bash deploy/scripts/wait-public-health.sh

          # Fail fast if public badge-pin rejects the same secrets Playwright will use.
          code="$(curl -sS -o /tmp/smoke-badge.json -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -H 'st-auth-mode: header' \
            --data "{\"badgeId\":\"${SMOKE_BADGE_ID}\",\"pin\":\"${SMOKE_PIN}\"}" \
            --max-time 20 \
            "${BASE_URL%/}/auth/badge-pin" || echo 000)"
          if [ "${code}" != "200" ]; then
            echo "::error::Public badge-pin login failed (HTTP ${code}) before Playwright."
            echo "::error::Body: $(head -c 240 /tmp/smoke-badge.json 2>/dev/null || true)"
            echo "failure_kind=config" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "Public badge-pin OK (HTTP 200)"
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e deps
        working-directory: e2e
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: e2e
        run: npx playwright install-deps chromium

      - name: Run smoke suite
        working-directory: e2e
        env:
          CI: true
          BASE_URL: ${{ secrets.AWS_PUBLIC_URL }}
          SMOKE_BADGE_ID: ${{ secrets.SMOKE_BADGE_ID }}
          SMOKE_PIN: ${{ secrets.SMOKE_PIN }}
        run: npx playwright test --retries=2 --reporter=list,html,json

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: e2e/playwright-report/
          if-no-files-found: ignore

  # ── Rollback only when public /health shows an app/origin failure (not CDN/secrets/UI) ─
  rollback-on-smoke-failure:
    name: Rollback QA on smoke failure
    needs: [resolve, deploy, smoke]
    if: ${{ failure() && needs.deploy.result == 'success' && needs.smoke.outputs.failure_kind == 'app' }}
    runs-on: [self-hosted, linux, zedral-aws-qa]
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.commit_sha }}

      - name: Roll back to previous images (local)
        env:
          APP_DIR: ${{ secrets.AWS_APP_DIR }}
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${APP_DIR:-}" ] || [ "${APP_DIR}" = "/" ]; then APP_DIR="/opt/zedral"; fi
          export APP_BASE="${APP_DIR}"
          bash "${APP_DIR}/deploy/scripts/rollback-images.sh" || true
          bash deploy/scripts/notify-deploy.sh rollback \
            "AWS QA rolled back after public /health app failure (${{ needs.resolve.outputs.image_tag }})"

  # ── Report (GitHub-hosted) ───────────────────────────────────────────────────
  report:
    name: QA deployment report
    needs: [resolve, deploy, smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Write report
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          mkdir -p artifacts
          {
            echo "# AWS QA deployment report"
            echo ""
            echo "- Image tag: \`${{ needs.resolve.outputs.image_tag }}\`"
            echo "- Backend: \`${{ needs.resolve.outputs.backend_image }}\`"
            echo "- Nginx: \`${{ needs.resolve.outputs.nginx_image }}\`"
            echo "- Deploy: \`${{ needs.deploy.result }}\`"
            echo "- Smoke: \`${{ needs.smoke.result }}\`"
            echo "- Time: $(date -u -Is)"
            echo ""
            echo "Ready for manual QA. When satisfied, open **Actions → Deploy Production (Factory) → Run workflow** with the same SHA (or \`latest-main\` / \`vX.Y.Z\`)."
          } > artifacts/qa-report.md
          cat artifacts/qa-report.md

          if [ "${{ needs.deploy.result }}" = "success" ] && { [ "${{ needs.smoke.result }}" = "success" ] || [ "${{ needs.smoke.result }}" = "skipped" ]; }; then
            bash deploy/scripts/notify-deploy.sh success "AWS QA OK ${{ needs.resolve.outputs.image_tag }}"
          else
            bash deploy/scripts/notify-deploy.sh failed "AWS QA FAILED tag=${{ needs.resolve.outputs.image_tag }} deploy=${{ needs.deploy.result }} smoke=${{ needs.smoke.result }}"
            # Do not exit 1 here: smoke/deploy already failed the workflow. Keep report green so the artifact uploads.
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aws-qa-deployment-report
          path: artifacts/qa-report.md
