name: CI

# Build Once: quality gates + (on main) push immutable images to GHCR.
# Deploy Many: deploy-aws.yml (QA) and deploy-production.yml (Factory) only pull these tags.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  quality:
    name: Lint · Build · Test · Arch · Security
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: m1_user
          POSTGRES_PASSWORD: m1_password
          POSTGRES_DB: m1_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U m1_user -d m1_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: m1_user
      DB_PASSWORD: m1_password
      DB_NAME: m1_db
      DATABASE_URL: postgres://m1_user:m1_password@localhost:5432/m1_db
      TEST_DATABASE_URL: postgres://m1_user:m1_password@localhost:5432/m1_db
      JWT_SECRET: ci-test-secret-at-least-16-chars-long
      AUTH_STRICT: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Typecheck / build all workspaces
        run: npm run build

      - name: Client unit tests
        run: npm run test -w @m1/client

      - name: Operator APK bundle check
        run: npm run check:operator-bundle -w @m1/client

      - name: Database migrations
        working-directory: packages/server
        run: npm run migrate

      - name: Server unit tests
        run: npm run test:unit -w @m1/server

      - name: Server integration tests
        run: npm run test:integration -w @m1/server

      - name: Architecture check
        run: npm run arch:check

      - name: npm audit (high+)
        run: npm audit --audit-level=high
        continue-on-error: true

  docker-build-push:
    name: Docker build · Trivy · Push GHCR
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ steps.meta.outputs.backend }}
      nginx_image: ${{ steps.meta.outputs.nginx }}
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image tags
        id: meta
        run: |
          TAG="${GITHUB_SHA}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "backend=${IMAGE_PREFIX}/backend:${TAG}" >> "$GITHUB_OUTPUT"
          echo "nginx=${IMAGE_PREFIX}/nginx:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend (local, for scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: backend
          push: false
          load: true
          tags: zedral-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build nginx (local, for scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: nginx
          push: false
          load: true
          tags: zedral-nginx:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Worker target does not exist in Dockerfile — skipped.

      - name: Trivy scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: zedral-backend:ci
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          skip-files: '**/node_modules/esbuild/bin/esbuild,**/node_modules/@esbuild/**/esbuild'

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Tag and push images to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          TAG="${GITHUB_SHA}"

          docker tag zedral-backend:ci "${IMAGE_PREFIX}/backend:${TAG}"
          docker tag zedral-backend:ci "${IMAGE_PREFIX}/backend:latest-main"
          docker tag zedral-nginx:ci "${IMAGE_PREFIX}/nginx:${TAG}"
          docker tag zedral-nginx:ci "${IMAGE_PREFIX}/nginx:latest-main"

          docker push "${IMAGE_PREFIX}/backend:${TAG}"
          docker push "${IMAGE_PREFIX}/backend:latest-main"
          docker push "${IMAGE_PREFIX}/nginx:${TAG}"
          docker push "${IMAGE_PREFIX}/nginx:latest-main"

          {
            echo "## GHCR images (this commit)"
            echo ""
            echo "| Service | Tags |"
            echo "|---------|------|"
            echo "| backend | \`${IMAGE_PREFIX}/backend:${TAG}\` · \`latest-main\` |"
            echo "| nginx | \`${IMAGE_PREFIX}/nginx:${TAG}\` · \`latest-main\` |"
            echo ""
            echo "AWS QA auto-deploys the **SHA** tag. Promote to Factory manually via **Deploy Production** → Run workflow (\`latest-main\`, SHA, or \`vX.Y.Z\`)."
          } >> "$GITHUB_STEP_SUMMARY"
